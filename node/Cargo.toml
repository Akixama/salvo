[package]
name = "salvo-node"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Salvo: Gatling parallel consensus with Solana execution on LiteSVM"

[[bin]]
name = "salvo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bincode = "1.3"
bs58 = "0.5"
aes-gcm = "0.10"
curve25519-dalek = "4"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-util = "0.3"
litesvm = "=0.10.0"
miniz_oxide = "0.8"
parking_lot = "0.12"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-account = "3.2"
solana-address = { version = "2.0", features = ["decode"] }
solana-clock = "3.0"
solana-hash = "3.1"
solana-instruction = "3.0"
solana-keypair = "3.1"
solana-message = "3.0.1"
solana-native-token = "3.0"
solana-signature = "3.1"
solana-signer = "3.0"
solana-system-interface = { version = "2.0", features = ["bincode"] }
solana-transaction = { version = "3.0", features = ["bincode", "verify"] }
solana-transaction-error = "3.0"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Media"] }

[profile.release]
opt-level = 3
debug = 0
